<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tharunsai B — Backend Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #18181b;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      color: var(--text);
      background: var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: clamp(48px, 10vh, 120px) clamp(20px, 5vw, 48px);
    }

    .content {
      width: 100%;
      max-width: 600px;
    }

    header {
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(26px, 4vw, 32px);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .role {
      font-size: 15px;
      color: var(--muted);
      font-weight: 400;
    }

    .intro p {
      color: var(--text);
      margin-bottom: 12px;
    }

    .intro p:last-child {
      margin-bottom: 0;
    }

    a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 2px;
      text-decoration-color: var(--border);
      transition: text-decoration-color 0.15s ease;
    }

    a:hover {
      text-decoration-color: var(--text);
    }

    .rows {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-top: 32px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    .row {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 8px 24px;
      align-items: start;
    }

    .row-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding-top: 3px;
    }

    .row-body strong {
      font-weight: 600;
      font-size: 15px;
    }

    .row-meta {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .row-detail {
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    footer {
      margin-top: 40px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
    }

    .links a {
      font-size: 14px;
      color: var(--muted);
      text-decoration: none;
    }

    .links a:hover {
      color: var(--text);
    }

    @media (max-width: 520px) {
      .row {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
 <div class="container">
  <div class="building"></div>
  <p>Our website is currently under construction.</p>
  <p>Please check back soon!</p>
</div>
  </div>
</body>
</html>
