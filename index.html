<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

 

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #080808;
      --surface: #101010;
      --surface-2: #151515;
      --text: #f4f4f0;
      --muted: #8b8b87;
      --line: #252525;
      --accent: #d7ff3f;
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Manrope", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: var(--accent);
      color: #000;
    }

    .container {
      width: min(calc(100% - 48px), var(--max));
      margin: auto;
    }

    /* NAV */

    nav {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-family: "DM Mono", monospace;
      font-size: 14px;
      letter-spacing: -0.04em;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 30px;
      color: var(--muted);
      font-size: 13px;
    }

    .nav-links a {
      transition: color .2s ease;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    /* HERO */

    .hero {
      min-height: 680px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      right: -220px;
      top: 80px;
      border: 1px solid #202020;
      border-radius: 50%;
      box-shadow:
        0 0 0 80px #0d0d0d,
        0 0 0 160px #0b0b0b;
      pointer-events: none;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-family: "DM Mono", monospace;
      font-size: 12px;
      margin-bottom: 28px;
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 14px var(--accent);
    }

    h1 {
      max-width: 900px;
      font-size: clamp(64px, 10vw, 128px);
      line-height: .88;
      letter-spacing: -0.075em;
      font-weight: 800;
      position: relative;
      z-index: 1;
    }

    h1 em {
      color: var(--muted);
      font-style: normal;
    }

    .hero-bottom {
      margin-top: 55px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 40px;
      position: relative;
      z-index: 1;
    }

    .intro {
      max-width: 480px;
      color: var(--muted);
      font-size: 16px;
    }

    .intro strong {
      color: var(--text);
      font-weight: 600;
    }

    .availability {
      font-family: "DM Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* SECTION */

    section {
      padding: 110px 0;
      border-bottom: 1px solid var(--line);
    }

    .section-head {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 40px;
      margin-bottom: 55px;
    }

    .section-number {
      color: var(--accent);
      font-family: "DM Mono", monospace;
      font-size: 12px;
    }

    .section-title {
      font-size: clamp(32px, 5vw, 58px);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    /* ABOUT */

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      background: var(--line);
      border: 1px solid var(--line);
    }

    .about-card {
      background: var(--surface);
      padding: 38px;
      min-height: 190px;
    }

    .about-card h3 {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 18px;
    }

    .about-card p {
      font-size: 20px;
      line-height: 1.45;
      letter-spacing: -.025em;
    }

    .tech-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tech {
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: #0d0d0d;
      font-family: "DM Mono", monospace;
      font-size: 11px;
      color: #bdbdb8;
    }

    /* WORK */

    .work-item {
      display: grid;
      grid-template-columns: 100px 1fr 250px;
      gap: 35px;
      padding: 35px 0;
      border-top: 1px solid var(--line);
      transition: padding .25s ease;
    }

    .work-item:last-child {
      border-bottom: 1px solid var(--line);
    }

    .work-item:hover {
      padding-left: 15px;
      padding-right: 15px;
      background: var(--surface);
    }

    .year {
      color: var(--muted);
      font-family: "DM Mono", monospace;
      font-size: 12px;
    }

    .work-title {
      font-size: 25px;
      font-weight: 600;
      letter-spacing: -.04em;
    }

    .work-company {
      color: var(--accent);
      font-family: "DM Mono", monospace;
      font-size: 11px;
      margin-top: 5px;
    }

    .work-description {
      color: var(--muted);
      font-size: 13px;
      align-self: center;
    }

    /* PROJECTS */

    .projects {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .project {
      min-height: 390px;
      padding: 32px;
      background: var(--surface);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition:
        transform .3s ease,
        border-color .3s ease;
    }

    .project:hover {
      transform: translateY(-6px);
      border-color: #444;
    }

    .project::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -100px;
      bottom: -100px;
      border: 1px solid #292929;
      border-radius: 50%;
    }

    .project-number {
      color: var(--accent);
      font-family: "DM Mono", monospace;
      font-size: 12px;
    }

    .project h3 {
      max-width: 500px;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1;
      letter-spacing: -.055em;
      margin-bottom: 18px;
    }

    .project p {
      max-width: 470px;
      color: var(--muted);
      font-size: 14px;
    }

    .project-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 25px;
    }

    .project-stack span {
      font-family: "DM Mono", monospace;
      font-size: 10px;
      color: #aaa;
      border: 1px solid var(--line);
      padding: 6px 9px;
    }

    /* CONTACT */

    .contact {
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .contact h2 {
      max-width: 900px;
      font-size: clamp(48px, 8vw, 100px);
      line-height: .92;
      letter-spacing: -.07em;
    }

    .contact h2 span {
      color: var(--accent);
    }

    .contact-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 50px;
    }

    .contact-links a {
      border: 1px solid #333;
      padding: 13px 20px;
      font-family: "DM Mono", monospace;
      font-size: 11px;
      transition: all .2s ease;
    }

    .contact-links a:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    /* FOOTER */

    footer {
      padding: 25px 0;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-family: "DM Mono", monospace;
      font-size: 10px;
    }

    /* RESPONSIVE */

    @media (max-width: 800px) {
      .container {
        width: min(calc(100% - 32px), var(--max));
      }

      nav {
        height: 70px;
      }

      .nav-links {
        display: none;
      }

      .hero {
        min-height: 620px;
      }

      .hero-bottom {
        flex-direction: column;
        align-items: start;
      }

      .section-head {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .about-grid,
      .projects {
        grid-template-columns: 1fr;
      }

      .work-item {
        grid-template-columns: 70px 1fr;
        gap: 15px;
      }

      .work-description {
        grid-column: 2;
      }
    }

    @media (max-width: 520px) {
      h1 {
        font-size: 62px;
      }

      section {
        padding: 75px 0;
      }

      .about-card {
        padding: 25px;
      }

      .project {
        min-height: 350px;
        padding: 25px;
      }

      .work-title {
        font-size: 20px;
      }

      footer {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>

<body>

   <div class="container">
  <div class="building"></div>
  <p>Our website is currently under construction.</p>
  <p>Please check back soon!</p>
</div>


</body>
</html>
